name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Native Windows is first-class: one full-suite leg on the version
          # most users run. Hook smoke tests live in plugin.yml.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # api + mcp included so the FastAPI route tests and MCP server
          # tests actually run in CI instead of importorskip-ing away.
          pip install -e ".[dev,api,mcp]"

      - name: Run tests
        run: pytest --cov=clara --cov-report=term-missing --cov-fail-under=70 --tb=short -q

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"
          pip install ruff mypy

      # Blocking, not advisory: pyproject declares strict lint/type rules, so
      # CI enforces them instead of letting regressions land silently.
      - name: Ruff
        run: ruff check clara tests

      - name: Mypy
        run: mypy clara

  bench:
    name: Latency benchmarks (10k-row store)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Run benchmarks
        run: pytest -m bench -q --tb=short
