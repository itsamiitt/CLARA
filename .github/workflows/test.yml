name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # api + mcp included so the FastAPI route tests and MCP server
          # tests actually run in CI instead of importorskip-ing away.
          pip install -e ".[dev,api,mcp]"

      - name: Run tests
        run: pytest --cov=clara --cov-report=term-missing --cov-fail-under=70 --tb=short -q

      - name: Run type check (optional)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: |
          pip install mypy
          mypy clara/ --ignore-missing-imports
