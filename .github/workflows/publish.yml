name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test built package
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        run: |
          python -m pip install --upgrade pip
          # Install the wheel WITH its test extras so the API/MCP suites run
          # instead of importorskip-ing away. Previously the minimal deps meant
          # a green run proved almost nothing about the wheel.
          pip install "$(echo dist/*.whl)[dev,api,mcp]"

      - name: Run tests against the installed wheel
        # Run from a throwaway dir with --pyargs so the imported package is the
        # installed wheel, not the ./clara source tree that would otherwise
        # shadow it at the repo root.
        run: |
          mkdir -p _wheel_test && cd _wheel_test
          cp -r ../tests ./tests
          cp ../pyproject.toml ./pyproject.toml
          pytest tests --tb=short -q -p no:cacheprovider

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
