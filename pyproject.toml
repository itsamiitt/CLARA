[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-memory"
version = "0.1.0"
description = "Cognitive Living Architecture for Reliable Agents — a structured, living-memory system for autonomous AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Amit", email = "itsamiitt@github.local" },
]
keywords = [
    "ai",
    "agents",
    "memory",
    "cognitive-architecture",
    "llm",
    "rag",
    "vector-search",
    "pgvector",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "pgvector>=0.3,<1.0",
    "apscheduler>=3.10,<4.0",
    "openai>=1.0,<3.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=2.2,<4.0",
]
anthropic = [
    "anthropic>=0.30,<1.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-mock>=3.14,<4.0",
    "aiosqlite>=0.20,<1.0",
    "hypothesis>=6.0,<7.0",
]
all = [
    "clara-memory[local,anthropic,dev]",
]

[project.urls]
Homepage = "https://github.com/itsamiitt/CLARA"
Repository = "https://github.com/itsamiitt/CLARA.git"
Issues = "https://github.com/itsamiitt/CLARA/issues"

[tool.setuptools.packages.find]
include = ["clara*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
