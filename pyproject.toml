[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-memory"
version = "0.1.0"
description = "Cognitive Living Architecture for Reliable Agents — a structured, living-memory system for autonomous AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Amit", email = "itsamiitt@github.local" },
]
keywords = [
    "ai",
    "agents",
    "memory",
    "cognitive-architecture",
    "llm",
    "rag",
    "vector-search",
    "lancedb",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Core stays tiny on purpose: the zero-key tier (LocalMemory, clara-mcp,
# clara CLI) needs only SQLAlchemy + aiosqlite (+ APScheduler for the
# library profile's maintenance jobs). LLM SDKs and the vector stack are
# extras.
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "apscheduler>=3.10,<4.0",
    "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0,<3.0",
]
vector = [
    "lancedb>=0.20,<1.0",
]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
cache = [
    "redis[hiredis]>=5.0,<6.0",
]
local = [
    "sentence-transformers>=2.2,<4.0",
]
anthropic = [
    "anthropic>=0.30,<1.0",
]
ollama = [
    "ollama>=0.3",
]
mcp = [
    "mcp>=1.2",
]
cli = [
    "mcp>=1.2",
]
full = [
    "clara-memory[openai,vector,api,cache,anthropic,ollama,mcp]",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<1.0",
    # the test suite exercises the full surface (vector + providers mocked
    # at the SDK boundary), so dev pulls the optional runtime deps too
    "openai>=1.0,<3.0",
    "lancedb>=0.20,<1.0",
]
all = [
    "clara-memory[full,dev,local]",
]

[project.scripts]
clara = "clara.cli:main"
clara-mcp = "clara.integrations.mcp_server:main"

[project.urls]
Homepage = "https://github.com/itsamiitt/CLARA"
Repository = "https://github.com/itsamiitt/CLARA.git"
Issues = "https://github.com/itsamiitt/CLARA/issues"

[tool.setuptools.packages.find]
include = ["clara*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not stress'"
markers = [
    "stress: heavy load tests, excluded from default run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["clara"]
branch = true
omit = [
    "clara/db/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
